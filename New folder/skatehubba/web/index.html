<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1.00001,viewport-fit=cover" />
    <title>SkateHubba</title>
    <style>
      #root, #__next {
        width: 100%;
        /* To smooth any scrolling behavior */
        -webkit-overflow-scrolling: touch;
        margin: 0px;
        padding: 0px;
        /* Allows content to fill the viewport and go beyond the bottom */
        min-height: 100%;
      }
      #__next {
        flex-shrink: 0;
        flex-basis: auto;
        flex-direction: column;
        flex-grow: 1;
        display: flex;
        flex: 1;
      }
      html, body {
        scroll-behavior: smooth;
        /* Prevent text size change on orientation change https://stackoverflow.com/a/16348000 */
        -webkit-text-size-adjust: 100%;
        height: 100%;
      }
      body {
        display: flex;
        /* Allows you to scroll below the viewport; default value is visible */
        overflow-y: auto;
        overscroll-behavior-y: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
      }
    </style>
    <!-- reCAPTCHA v3 -->
    <script src="https://www.google.com/recaptcha/api.js?render=6Le--90rAAAAAEkggT8kphMLPoSlW-O0nOoMNIiC" async defer></script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
