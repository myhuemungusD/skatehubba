name: CI - The Daily Grind

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # Lockfile integrity check - fails fast if package.json and lockfile are out of sync
  lockfile_check:
    name: "🔒 Lockfile Integrity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: ./.github/actions/setup-pnpm-env

      - name: Verify lockfile is up-to-date
        run: |
          echo "Checking if pnpm-lock.yaml matches package.json..."
          pnpm install --frozen-lockfile --ignore-scripts
          echo "✅ Lockfile is in sync with package.json"

  build_lint_typecheck:
    name: "Quality Control"
    needs: lockfile_check
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Show git ref + commit
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          git log -1 --oneline

      - uses: ./.github/actions/setup-pnpm-env

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Validate packages (duplicates, lockfiles, version consistency)
        run: pnpm run validate:packages

      - name: Validate package manager consistency
        run: pnpm run validate:package-manager

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        env:
          ALLOW_MISSING_PUBLIC_ENV: "true"
          EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          EXPO_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
        run: pnpm run build

      - name: Test with Coverage
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          EXPO_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
        run: pnpm vitest run --coverage

      - name: Generate Coverage Badge
        if: github.ref == 'refs/heads/main'
        uses: jaywcjlove/coverage-badges-cli@main
        with:
          source: coverage/coverage-summary.json
          output: coverage/badge.svg

      - name: Upload Coverage Report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      # ARTIFACT MANAGEMENT
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: client/dist
          retention-days: 5

  # Bundle size budget — prevents accidental bloat from reaching production
  bundle_size:
    name: "📦 Bundle Size Budget"
    needs: lockfile_check
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: ./.github/actions/setup-pnpm-env

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Client
        env:
          ALLOW_MISSING_PUBLIC_ENV: "true"
          EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          EXPO_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
        run: pnpm -C client build

      - name: Check bundle size budgets
        run: node scripts/check-bundle-size.mjs --ci

  # Database migration drift — ensures generated migrations match the schema
  migration_drift:
    name: "🗄️ Migration Drift Check"
    needs: lockfile_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: ./.github/actions/setup-pnpm-env

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for uncommitted migration changes
        run: |
          if ! pnpm db:generate 2>&1; then
            echo "::warning::drizzle-kit generate failed — skipping migration drift check"
            echo "If this persists, ensure drizzle.config.ts is valid"
            exit 0
          fi
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::Migration drift detected — schema changes exist without a committed migration"
            echo "Run 'pnpm db:generate' locally and commit the result"
            git diff drizzle/
            exit 1
          fi
          echo "✅ Migrations are in sync with schema"

  # Mobile app quality gates - typecheck + lint (runs in parallel with web QC)
  mobile_quality:
    name: "Mobile Quality Control"
    needs: lockfile_check
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: ./.github/actions/setup-pnpm-env

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck Mobile
        run: pnpm run typecheck

      - name: Lint Mobile
        run: pnpm run lint

  # Server quality gates — typecheck + lint + test for all server-side code
  server_quality:
    name: "Server Quality Control"
    needs: lockfile_check
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: ./.github/actions/setup-pnpm-env

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm -C server typecheck

      - name: Lint server
        run: pnpm -C server lint

      - name: Test server
        run: pnpm -C server test

      - name: Typecheck api
        run: pnpm -C api typecheck

      - name: Lint api
        run: pnpm -C api lint

      - name: Typecheck functions
        run: pnpm -C functions typecheck

      - name: Lint functions
        run: pnpm -C functions lint

      - name: Test functions
        run: pnpm -C functions test

      - name: Build functions
        run: pnpm -C functions build

  rules_scan:
    name: "Security Guardrail"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Block insecure Firestore/Storage rules
        run: |
          bad=0
          for f in firestore.rules storage.rules; do
            if [ -f "$f" ] && grep -nE "allow\s+read,\s*write:\s*if\s*true" "$f"; then
              echo "::error file=$f::Found insecure wildcard access in $f"
              bad=1
            fi
          done
          if [ $bad -eq 1 ]; then exit 1; fi

  # Firebase Rules Verification (protected branches only)
  firebase_rules_verify:
    name: "🔥 Firebase Rules Validation"
    runs-on: ubuntu-latest
    # M8: Run on PRs too (not just main pushes) to catch rule issues before merge
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' ||
       github.event_name == 'pull_request') &&
      github.repository == 'myhuemungusD/skatehubba'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: ./.github/actions/setup-pnpm-env

      - name: Install Firebase CLI
        run: curl -sL https://firebase.tools | bash

      - name: Mask Firebase Token
        run: echo "::add-mask::${{ secrets.FIREBASE_TOKEN }}"

      - name: Verify Firebase Rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node scripts/verify-firebase-rules.mjs

  # NOTE: EAS preview builds are handled by mobile-preview.yml (triggered on PR)

  # Mobile Detox Smoke Test — runs the Android smoke suite to catch regressions
  mobile_detox_smoke:
    name: "Mobile Detox Smoke"
    needs: mobile_quality
    uses: ./.github/workflows/mobile-e2e.yml
    secrets: inherit

  # Secret scanning with gitleaks (all branches and PRs)
  secret_scan:
    name: "No Secrets in Repo"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed for gitleaks to scan commit ranges
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Fetch base branch for PR comparison
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Block merge conflict markers
        run: |
          ! grep -RIn "^[<=>]\{7\}" -- . \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude=pnpm-lock.yaml

      - name: Install gitleaks
        run: |
          VERSION=$(curl -sS https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Gitleaks scan
        run: gitleaks detect --source=. --verbose --log-opts="$GITHUB_SHA"
